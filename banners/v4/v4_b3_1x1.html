<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1080px; overflow:hidden; background:#050E22; }
.canvas { position:relative; width:1080px; height:1080px; background:#050E22; font-family:'Inter',sans-serif; overflow:hidden; }
.display { font-family:'Playfair Display',serif; font-weight:800; letter-spacing:-.01em; }
</style></head><body>
<style>

.cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#3A8DFF 0%,#006EFF 100%); color:#fff; font-weight:800; border-radius:999px; border:1.5px solid rgba(255,255,255,.55); box-shadow:0 8px 28px rgba(0,110,255,.55), inset 0 1px 0 rgba(255,255,255,.35); white-space:nowrap; font-family:'Inter',sans-serif; }

.trust { display:flex; align-items:center; color:rgba(255,255,255,.9); font-weight:600; }
.trust img { display:block; }

.photobox { position:absolute; inset:0; overflow:hidden; z-index:1; background:#050E22; }
.photobox img { width:100%; height:100%; object-fit:cover; object-position:78% 30%; }
.scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,10,28,0) 0%, rgba(3,10,28,.15) 28%, rgba(3,10,28,.68) 52%, rgba(3,10,28,.94) 78%, rgba(3,10,28,.98) 100%); z-index:2; }
.topscrim { position:absolute; left:0; right:0; top:0; height:240px; background:linear-gradient(180deg, rgba(3,10,28,.78) 0%, rgba(3,10,28,.5) 40%, rgba(3,10,28,.15) 75%, rgba(3,10,28,0) 100%); z-index:3; pointer-events:none; }
.content { position:absolute; left:48px; right:48px; top:48px; bottom:48px; display:flex; flex-direction:column; z-index:5; }
.brandwrap { flex-shrink:0; }
.midspace { flex:1; }
.headline { font-size:74px; color:#FFFFFF; line-height:1.02; text-shadow:0 6px 40px rgba(0,0,0,.75); margin:0 0 20px 0; letter-spacing:-.015em; }
.credential-block { margin-bottom:14px; }
.courseinfo { margin-bottom:22px; }
.cta-row { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.trust { background:transparent; padding:0; border:none; box-shadow:none; }
</style>
<div class="canvas">
  <div class="photobox"><img src="../../assets/real_julie-hero.jpg"></div>
  <div class="scrim"></div>
  <div class="topscrim"></div>
  <div class="content">
    <div class="brandwrap">
<div class="brandlock" style="display:flex; align-items:center; justify-content:flex-start;">
  <img src="../../assets/lla_logo.png" style="height:142px; display:block; filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));">
</div></div>
    <div class="midspace"></div>
    <div class="display headline">Small habits.<br>Kept for years.</div>
    <div class="credential-block">
<div style="display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:5px;">
  <div style="font-weight:800; font-size:30px; color:#FFFFFF; text-shadow:0 2px 14px rgba(0,0,0,.6);">Julie Gibson Clark</div>
  <div style="font-weight:800; font-size:27px; color:#7EC8FF; letter-spacing:.005em; line-height:1.2; text-shadow:0 2px 14px rgba(0,0,0,.6);">2nd Slowest-Aging Person on Earth</div>
  <div style="font-weight:600; font-size:18px; color:rgba(191,224,255,.95); letter-spacing:.01em; line-height:1.3;">Longevity Life Academy Instructor</div>
</div></div>
    <div class="courseinfo"><div style="font-weight:700; font-size:19px; color:rgba(255,255,255,.94); letter-spacing:.01em; line-height:1.35; text-shadow:0 2px 12px rgba(0,0,0,.6);">The Longevity Masterclass &middot; 18 Live Sessions &middot; 100% Online</div></div>
    <div class="cta-row">
      <div class="trust" style="font-size:20px; gap:12px;"><img src="../../assets/tp_logo-white.svg" style="height:28px;"><img src="../../assets/tp_stars-5.svg" style="height:24px;"><span style="font-weight:800;">4.6/5</span></div>
      <span class="cta" style="font-size:25px; padding:20px 42px;">Join the Next Cohort <span>&rarr;</span></span>
    </div>
  </div>
</div></body></html>
