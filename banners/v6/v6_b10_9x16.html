<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#050E22; }
.canvas { position:relative; width:1080px; height:1920px; background:#050E22; font-family:'Inter',sans-serif; overflow:hidden; }
.display { font-family:'Playfair Display',serif; font-weight:800; letter-spacing:-.01em; }
</style></head><body>
<style>

.cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#3A8DFF 0%,#006EFF 100%); color:#fff; font-weight:800; border-radius:999px; border:1.5px solid rgba(255,255,255,.55); box-shadow:0 8px 28px rgba(0,110,255,.55), inset 0 1px 0 rgba(255,255,255,.35); white-space:nowrap; font-family:'Inter',sans-serif; }

.trust { display:flex; align-items:center; color:rgba(255,255,255,.9); font-weight:600; }
.trust img { display:block; }

.top { position:absolute; left:58px; right:58px; top:50px; z-index:10; }
.headline { font-size:64px; color:#FFFFFF; line-height:1.1; text-align:center; margin-top:26px; }
.split { position:absolute; left:0; right:0; top:440px; bottom:226px; display:flex; flex-direction:column; }
.side { position:relative; flex:1; overflow:hidden; }
.side img { width:100%; height:100%; object-fit:cover; }
.side.julie img { object-position:52% 20%; }
.side.bryan img { object-position:50% 45%; filter:grayscale(0.45) brightness(0.85); }
.tag { position:absolute; left:32px; top:32px; padding:10px 21px; border-radius:999px; font-weight:800; font-size:22px; letter-spacing:.02em; z-index:5; }
.tag.julie { background:#006EFF; color:#fff; }
.tag.bryan { background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.4); }
.statpanel { position:absolute; left:0; right:0; bottom:0; padding:29px 32px; z-index:5; }
.side.julie .statpanel { background:linear-gradient(180deg, transparent, rgba(3,14,40,.96) 55%); }
.side.bryan .statpanel { background:linear-gradient(180deg, transparent, rgba(10,10,12,.96) 55%); }
.bigstat { font-family:'Playfair Display',serif; font-weight:800; font-size:61px; color:#fff; line-height:1; }
.bigstat span { font-family:'Inter',sans-serif; font-size:22px; font-weight:700; color:rgba(255,255,255,.85); margin-left:10px; }
.statlabel { font-size:18px; color:#7EC8FF; font-weight:700; margin-top:5px; }
.side.bryan .statlabel { color:rgba(255,255,255,.55); }
.bullets { margin-top:18px; display:flex; flex-direction:column; gap:9px; }
.bullets div { font-size:20px; color:rgba(255,255,255,.92); font-weight:600; }
.side.bryan .bullets div { color:rgba(255,255,255,.65); }
.bar { position:absolute; left:0; right:0; bottom:0; height:226px; background:#03102A; border-top:1px solid rgba(126,200,255,.28); display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:18px 53px; z-index:20; gap:13px; }
.barrow { display:flex; align-items:center; justify-content:space-between; width:100%; gap:21px; }
.trust { background:transparent; padding:0; border:none; box-shadow:none; }
</style>
<div class="canvas">
  <div class="top">
    
<div class="brandlock" style="display:flex; align-items:center; justify-content:center;">
  <img src="../../assets/lla_logo.png" style="height:180px; display:block; filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));">
</div>
    <div class="display headline">She Beats Bryan Johnson.<br>For $289/mo.</div>
  </div>
  <div class="split">
    <div class="side julie">
      <img src="../../assets/real_julie-standing-hd.jpg">
      <div class="tag julie">JULIE GIBSON CLARK</div>
      <div class="statpanel">
        <div class="bigstat">#2 <span>slowest-aging person on Earth</span></div>
        <div class="statlabel">Rejuvenation Olympics leaderboard</div>
      </div>
    </div>
    <div class="side bryan">
      <img src="../../assets/bryan_johnson.jpg">
      <div class="tag bryan">BRYAN JOHNSON</div>
      <div class="statpanel">
        <div class="bigstat">$2M <span>spent per year</span></div>
        <div class="statlabel">Ranked below Julie on the same board</div>
      </div>
    </div>
  </div>
  <div class="bar">
    <div class="barrow">
      <div style="color:#fff; font-weight:700; font-size:25px;">The Longevity Masterclass &middot; 18 Live Sessions &middot; 100% Online &middot; from <span style="color:#7EC8FF; font-weight:800;">$289/mo</span></div>
      
    </div>
    <div class="barrow">
      <div class="trust" style="font-size:24px; gap:14px;"><img src="../../assets/tp_logo-white.svg" style="height:33px;"><img src="../../assets/tp_stars-5.svg" style="height:28px;"><span style="font-weight:800;">4.6/5</span></div>
      <span class="cta" style="font-size:29px; padding:24px 50px;">Enroll Now <span>&rarr;</span></span>
    </div>
  </div>
</div></body></html>
