<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; background:#050E22; }
.canvas { position:relative; width:1080px; height:1350px; background:#050E22; font-family:'Inter',sans-serif; overflow:hidden; }
.display { font-family:'Playfair Display',serif; font-weight:800; letter-spacing:-.01em; }
</style></head><body>
<style>

.cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#3A8DFF 0%,#006EFF 100%); color:#fff; font-weight:800; border-radius:999px; border:1.5px solid rgba(255,255,255,.55); box-shadow:0 8px 28px rgba(0,110,255,.55), inset 0 1px 0 rgba(255,255,255,.35); white-space:nowrap; font-family:'Inter',sans-serif; }

.trust { display:flex; align-items:center; gap:10px; color:rgba(255,255,255,.85); font-weight:600; }
.trust img.tpl { display:block; } .trust img.tps { display:block; }

.photobox { position:absolute; inset:0; overflow:hidden; }
.photobox img { width:100%; height:100%; object-fit:cover; object-position:52% 10%; }
.scrimtop { position:absolute; left:0; right:0; top:0; height:40%; background:linear-gradient(180deg, rgba(5,14,34,.55) 0%, transparent 100%); }
.card { position:absolute; left:62px; right:62px; bottom:49px; background:rgba(5,14,34,.90); border:1.5px solid rgba(126,200,255,.4); border-radius:24px; padding:49px; backdrop-filter:blur(6px); z-index:10; box-shadow:0 20px 60px rgba(0,0,0,.5); }
.headline { font-size:73px; color:#FFFFFF; line-height:1.08; margin:24px 0 22px 0; }
.footrow { display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding-top:22px; border-top:1px solid rgba(126,200,255,.2); gap:17px; flex-wrap:wrap; }
</style>
<div class="canvas">
  <div class="photobox"><img src="../../assets/real_julie-standing-hd.jpg"></div>
  <div class="scrimtop"></div>
  <div class="card">
    
<div class="brandlock" style="display:flex; align-items:center; justify-content:flex-start;">
  <img src="../../assets/lla_logo.png" style="height:167px; display:block; filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));">
</div>
    <div class="display headline">Aging is a habit.<br>Change it.</div>
    
<div style="display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:4px;">
  <div style="font-weight:800; font-size:24px; color:#FFFFFF;">Julie Gibson Clark</div>
  <div style="font-weight:600; font-size:16px; color:#7EC8FF; letter-spacing:.01em; line-height:1.35;">2nd Slowest-Aging Person on Earth</div>
  <div style="font-weight:600; font-size:16px; color:#7EC8FF; letter-spacing:.01em; line-height:1.35;">Longevity Life Academy Instructor</div>
</div>
    <div class="footrow">
      <div class="trust" style="font-size:17px; gap:10px;"><img class="tps" src="../../assets/tp_stars-5.svg" style="height:20px;"><span style="font-weight:800;">4.6/5</span></div>
      <span class="cta" style="font-size:26px; padding:21px 44px;">Join the Next Cohort <span>&rarr;</span></span>
    </div>
  </div>
</div></body></html>
