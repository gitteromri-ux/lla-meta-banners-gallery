<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#050E22; }
.canvas { position:relative; width:1080px; height:1920px; background:#050E22; font-family:'Inter',sans-serif; overflow:hidden; }
.display { font-family:'Playfair Display',serif; font-weight:800; letter-spacing:-.01em; }
</style></head><body>
<style>

.cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#3A8DFF 0%,#006EFF 100%); color:#fff; font-weight:800; border-radius:999px; border:1.5px solid rgba(255,255,255,.55); box-shadow:0 8px 28px rgba(0,110,255,.55), inset 0 1px 0 rgba(255,255,255,.35); white-space:nowrap; font-family:'Inter',sans-serif; }

.trust { display:flex; align-items:center; gap:10px; color:rgba(255,255,255,.85); font-weight:600; }
.trust img.tpl { display:block; } .trust img.tps { display:block; }

.photobox { position:absolute; inset:0; overflow:hidden; z-index:1; background:#050E22; }
.photobox img { width:100%; height:100%; object-fit:cover; object-position:52% 18%; }
.scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,10,28,0) 0%, rgba(3,10,28,.15) 30%, rgba(3,10,28,.65) 55%, rgba(3,10,28,.92) 80%, rgba(3,10,28,.98) 100%); z-index:2; }
.topscrim { position:absolute; left:0; right:0; top:0; height:320px; background:linear-gradient(180deg, rgba(3,10,28,.78) 0%, rgba(3,10,28,.5) 40%, rgba(3,10,28,.15) 75%, rgba(3,10,28,0) 100%); z-index:3; pointer-events:none; }
.content { position:absolute; left:64px; right:64px; top:64px; bottom:64px; display:flex; flex-direction:column; z-index:5; }
.brandwrap { flex-shrink:0; }
.midspace { flex:1; }
.headline { font-size:117px; color:#FFFFFF; line-height:1.02; text-shadow:0 6px 40px rgba(0,0,0,.75); margin:0 0 32px 0; letter-spacing:-.015em; }
.credential-block { margin-bottom:32px; }
.cta-row { display:flex; align-items:center; justify-content:space-between; gap:26px; flex-wrap:wrap; }
.trust { background:transparent; padding:0; border:none; box-shadow:none; }
</style>
<div class="canvas">
  <div class="photobox"><img src="../../assets/real_julie-standing-hd.jpg"></div>
  <div class="scrim"></div>
  <div class="topscrim"></div>
  <div class="content">
    <div class="brandwrap">
<div class="brandlock" style="display:flex; align-items:center; justify-content:flex-start;">
  <img src="../../assets/lla_logo.png" style="height:220px; display:block; filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));">
</div></div>
    <div class="midspace"></div>
    <div class="display headline">Add healthy years<br>to your life.</div>
    <div class="credential-block">
<div style="display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:5px;">
  <div style="font-weight:800; font-size:32px; color:#FFFFFF;">Julie Gibson Clark</div>
  <div style="font-weight:600; font-size:22px; color:#7EC8FF; letter-spacing:.01em; line-height:1.35;">2nd Slowest-Aging Person on Earth</div>
  <div style="font-weight:600; font-size:22px; color:#7EC8FF; letter-spacing:.01em; line-height:1.35;">Longevity Life Academy Instructor</div>
</div></div>
    <div class="cta-row">
      <div class="trust" style="font-size:24px; gap:12px;"><img class="tps" src="../../assets/tp_stars-5.svg" style="height:29px;"><span style="font-weight:800;">4.6/5</span></div>
      <span class="cta" style="font-size:33px; padding:26px 56px;">Apply Now <span>&rarr;</span></span>
    </div>
  </div>
</div></body></html>
